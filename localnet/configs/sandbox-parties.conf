// Overlay for `daml sandbox -c ...` / Canton sandbox (SDK 3.4.9).
// Declarative DAR upload + party allocation via Canton alpha-dynamic config.
canton.parameters.enable-alpha-state-via-config = yes
canton.parameters.state-refresh-interval = 5s

canton.participants.sandbox.alpha-dynamic {
  dars = [
    { location = "../.daml/dist/cbtc-collateral-desk-0.1.0.dar" }
  ]
  parties = [
    { party = "Desk" }
    { party = "CreditOfficer" }
    { party = "Lender" }
    { party = "Borrower" }
    { party = "Liquidator" }
    { party = "MockIssuer" }
    { party = "GroftyAuth" }
  ]
  remove-parties = false
}
