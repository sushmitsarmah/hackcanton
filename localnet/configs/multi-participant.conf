// Path B — Canton OSS simple topology (SDK 3.4.9 / bundled canton.jar).
// Two participants + one synchronizer (sequencer1 + mediator1), in-memory storage.
// Ports intentionally avoid Path A sandbox (:6865 / :6866 / :7575). See path-b.env.
//
// Start: ./localnet/scripts/start-multi.sh
// Bootstrap (auto via --bootstrap): localnet/configs/bootstrap-multi.canton
//
// Honest limit: Desk.Demo scripts allocate ALL parties on a single participant via
// allocateParty, so cross-participant Desk.Demo is NOT supported as-is. Path B proves
// multi-node bring-up, synchronizer connect, DAR upload, and party hosting on each node.

canton {
  sequencers {
    sequencer1 {
      storage.type = memory
      public-api.port = 5001
      admin-api.port = 5002
      sequencer.type = BFT
    }
  }

  mediators {
    mediator1 {
      storage.type = memory
      admin-api.port = 5202
    }
  }

  participants {
    // Desk / CreditOfficer / MockIssuer host (intended)
    participant1 {
      storage.type = memory
      admin-api.port = 5012
      ledger-api.port = 5011
      http-ledger-api.port = 5013
    }
    // Lender / Borrower / Liquidator / GroftyAuth host (intended)
    participant2 {
      storage.type = memory
      admin-api.port = 5022
      ledger-api.port = 5021
      http-ledger-api.port = 5023
    }
  }
}
